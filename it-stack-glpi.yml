# it-stack-glpi.yml — IT-Stack Module Manifest
# Module 17: GLPI IT service management and CMDB

module:
  name: glpi
  number: "17"
  repo: it-stack-dev/it-stack-glpi
  version: "0.1.0"
  phase: 4
  category: it-management
  server: lab-mgmt1
  description: "GLPI IT service management and CMDB"

upstream:
  name: GLPI
  image: diouxx/glpi:latest
  license: GPL-2.0

ports:
  - 80 (HTTP)
   - 443 (HTTPS)

labs:
  - id: "17-01"
    name: Standalone
    docker_compose: docker/docker-compose.standalone.yml
    test_script: tests/labs/test-lab-17-01.sh
  - id: "17-02"
    name: External Dependencies
    docker_compose: docker/docker-compose.lan.yml
    test_script: tests/labs/test-lab-17-02.sh
  - id: "17-03"
    name: Advanced Features
    docker_compose: docker/docker-compose.advanced.yml
    test_script: tests/labs/test-lab-17-03.sh
  - id: "17-04"
    name: SSO Integration
    docker_compose: docker/docker-compose.sso.yml
    test_script: tests/labs/test-lab-17-04.sh
  - id: "17-05"
    name: Advanced Integration
    docker_compose: docker/docker-compose.integration.yml
    test_script: tests/labs/test-lab-17-05.sh
  - id: "17-06"
    name: Production Deployment
    docker_compose: docker/docker-compose.production.yml
    test_script: tests/labs/test-lab-17-06.sh

resources:
  cpu_cores: 2
  ram_gb: 2
  disk_gb: 20

health_check:
  endpoint: /health
  metrics_endpoint: /metrics
  log_path: /var/log/glpi/
