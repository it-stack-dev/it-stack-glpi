# =============================================================================
# IT-Stack: GLPI — Lab 04: SSO Integration
# Module 17 · Phase 4 · Lab 04
# =============================================================================
# Services: MariaDB · OpenLDAP · Keycloak · Mailhog · GLPI
# Ports:    App:8432  Keycloak:8532  LDAP:3897  Mailhog:8732
# Credentials:
#   DB root:    RootLab04!
#   GLPI DB:    glpi / GlpiLab04!
#   GLPI UI:    glpi / glpi (default)
#   Keycloak:   admin / Admin04!
#   LDAP admin: cn=admin,dc=lab,dc=local / LdapLab04!
# What's new vs Lab 03:
#   + OpenLDAP directory for LDAP authentication
#   + Keycloak 24 dev-mode as SAML/OIDC IdP (it-stack realm)
#   + GLPI LDAP env vars (GLPI_LDAP_*)
#   + Keycloak SAML metadata endpoint tested in Lab 04
# =============================================================================

name: it-stack-glpi-lab04

services:

  # ── MariaDB ──────────────────────────────────────────────────────────────
  glpi-s04-db:
    image: mariadb:10.11
    container_name: glpi-s04-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootLab04!
      MYSQL_DATABASE: glpi
      MYSQL_USER: glpi
      MYSQL_PASSWORD: GlpiLab04!
    volumes:
      - glpi-s04-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-pRootLab04!", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - glpi-s04-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ── OpenLDAP ─────────────────────────────────────────────────────────────
  glpi-s04-ldap:
    image: osixia/openldap:1.5.0
    container_name: glpi-s04-ldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "IT-Stack Lab"
      LDAP_DOMAIN: lab.local
      LDAP_ADMIN_PASSWORD: LdapLab04!
      LDAP_CONFIG_PASSWORD: ConfigLab04!
      LDAP_BASE_DN: dc=lab,dc=local
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: readonly
      LDAP_READONLY_USER_PASSWORD: ReadOnly04!
    ports:
      - "3897:389"
    volumes:
      - glpi-s04-ldap-data:/var/lib/ldap
      - glpi-s04-ldap-config:/etc/ldap/slapd.d
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b dc=lab,dc=local -D cn=admin,dc=lab,dc=local -w LdapLab04! cn=admin > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - glpi-s04-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # ── Keycloak ─────────────────────────────────────────────────────────────
  glpi-s04-kc:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: glpi-s04-kc
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: Admin04!
      KC_HEALTH_ENABLED: "true"
      KC_DB: dev-file
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8532:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/realms/master || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - glpi-s04-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ── Mailhog ──────────────────────────────────────────────────────────────
  glpi-s04-mail:
    image: mailhog/mailhog:latest
    container_name: glpi-s04-mail
    restart: unless-stopped
    ports:
      - "8732:8025"
    networks:
      - glpi-s04-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.1"

  # ── GLPI ─────────────────────────────────────────────────────────────────
  glpi-s04-app:
    image: diouxx/glpi:latest
    container_name: glpi-s04-app
    restart: unless-stopped
    depends_on:
      glpi-s04-db:
        condition: service_healthy
      glpi-s04-ldap:
        condition: service_healthy
    ports:
      - "8432:80"
    environment:
      MYSQL_HOST: glpi-s04-db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: glpi
      MYSQL_USER: glpi
      MYSQL_PASSWORD: GlpiLab04!
      # LDAP configuration
      GLPI_LDAP_HOST: glpi-s04-ldap
      GLPI_LDAP_PORT: "389"
      GLPI_LDAP_BASE_DN: dc=lab,dc=local
      GLPI_LDAP_BIND_DN: cn=admin,dc=lab,dc=local
      GLPI_LDAP_BIND_PASSWORD: LdapLab04!
      # Keycloak SAML IdP reference
      KEYCLOAK_URL: http://glpi-s04-kc:8080
      KEYCLOAK_REALM: it-stack
      KEYCLOAK_CLIENT_ID: glpi
    volumes:
      - glpi-s04-app-data:/var/www/html/glpi/files
    networks:
      - glpi-s04-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  glpi-s04-net:
    name: glpi-s04-net
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  glpi-s04-db-data:
  glpi-s04-ldap-data:
  glpi-s04-ldap-config:
  glpi-s04-app-data:
